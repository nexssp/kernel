name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: build · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Fast binary install (~2s), isolates linter dependencies from go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          task tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'task tidy' locally and commit the result."
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Tools
        run: task tools

      - name: Build
        run: task build

      - name: Run CI gate
        run: task ci

      - name: Vulnerability scan
        run: task vuln

      - name: Benchmark smoke check
        run: task bench

  portability:
    name: portability · ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit is where lock-free/atomic code and int-width assumptions break.
          - { goos: linux,   goarch: "386",   run_tests: true }
          - { goos: linux,   goarch: arm }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet (compiles production and test code for the target)
        run: go vet ./...

      - name: Test
        if: ${{ matrix.run_tests }}
        run: go test -short -count=1 ./...
