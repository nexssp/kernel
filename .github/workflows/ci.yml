name: Go CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  module-tidy:
    name: Go module tidy check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify go.mod and go.sum are tidy
        run: |
          task tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'task tidy' locally and commit the result."
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi

  build:
    name: Build all Go packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: task build

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Fast binary install (~2s), isolates linter dependencies from go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Run Go lint
        run: task lint

  unit-race-tests:
    name: Go unit and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run uncached race-enabled unit tests
        run: task test:race:nocache

  portability:
    name: portability · ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit is where lock-free/atomic code and int-width assumptions break.
          - { goos: linux,   goarch: "386",   run_tests: true }
          - { goos: linux,   goarch: arm }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet (compiles production and test code for the target)
        run: go vet ./...

      - name: Test
        if: ${{ matrix.run_tests }}
        run: go test -short -count=1 ./...

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tools
        run: task tools

      - name: Vulnerability scan
        run: task vuln

  benchmark:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run benchmark smoke check
        run: task bench

  # Preserve this job identity as the stable branch-protection gate.
  verify:
    name: build · lint · test
    if: ${{ always() }}
    needs:
      - module-tidy
      - build
      - lint
      - unit-race-tests
      - portability
      - vulnerability
      - benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report every failed required check
        env:
          MODULE_TIDY_RESULT: ${{ needs.module-tidy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RACE_TESTS_RESULT: ${{ needs.unit-race-tests.result }}
          PORTABILITY_RESULT: ${{ needs.portability.result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: |
          set -Eeuo pipefail
          failed=0
          check_result() {
            local check_id="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              printf '::error::Required check %s result: %s\n' "$check_id" "${result:-unknown}"
              failed=1
            fi
          }
          check_result module-tidy "$MODULE_TIDY_RESULT"
          check_result build "$BUILD_RESULT"
          check_result lint "$LINT_RESULT"
          check_result unit-race-tests "$UNIT_RACE_TESTS_RESULT"
          check_result portability "$PORTABILITY_RESULT"
          check_result vulnerability "$VULNERABILITY_RESULT"
          check_result benchmark "$BENCHMARK_RESULT"
          exit "$failed"
