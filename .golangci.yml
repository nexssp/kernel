version: "2"

run:
  tests: true
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - nilnil
    - noctx
    - gosec
    - gocritic
    - dupl
    - prealloc
    - perfsprint
    - nolintlint
    - wastedassign
    - musttag
    - rowserrcheck
    - sqlclosecheck
    - modernize
    - usestdlibvars
    - usetesting

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
    govet:
      enable:
        - shadow
      disable:
        - fieldalignment

  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
          - prealloc
          - nilnil
      - path: _test\.go
        text: '^shadow: declaration of "err"'
        linters:
          - govet
    paths:
      - vendor

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: strict
    paths:
      - vendor
